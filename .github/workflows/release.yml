name: Release

# Push a tag matching package.json's version (e.g. `v0.2.0`) to build installers
# for every OS and attach them — plus the latest*.yml update feeds — to a DRAFT
# GitHub Release. Publishing the draft is what makes electron-updater see it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # electron-builder creates the draft release and uploads assets

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64 --x64
          - os: windows-latest
            args: --win --x64
          - os: ubuntu-latest
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Node 26 bundles npm 11; devEngines requires npm >= 12. setup-node's npm
      # cache runs `npm config get cache` inside the repo, which devEngines
      # rejects under npm 11, so: Node first, then npm 12 (installed outside the
      # repo), then a second setup-node pass that only enables the cache.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Upgrade npm
        run: npm install -g npm@12
        working-directory: ${{ runner.temp }}

      - name: Cache npm
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Packaged builds need an absolute API URL (repo Settings → Variables →
      # VITE_API_BASE_URL). Exported only when set: an empty value would fail
      # the UI's config validation at startup.
      - name: Build and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          # Code signing is opt-in — see README "Releasing". Without these,
          # macOS builds are ad-hoc signed and Windows builds are unsigned.
          # CSC_LINK: ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$API_BASE_URL" ]; then export VITE_API_BASE_URL="$API_BASE_URL"; fi
          npm run build
          npx electron-builder --config electron-builder.config.ts ${{ matrix.args }} --publish always
